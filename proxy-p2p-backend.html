<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Proxy - Interesting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 1px;
            height: 1px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .top-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: white;
        }

        .title {
            font-size: 3.5em;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .search-wrapper {
            width: 100%;
            max-width: 500px;
            margin-bottom: 40px;
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.95);
            font-size: 16px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .search-box:focus {
            box-shadow: 0 4px 30px rgba(42, 82, 152, 0.4);
        }

        .search-box::placeholder {
            color: #999;
        }

        .buttons-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .bottom-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: flex-end;
            align-items: center;
        }

        .preview-area {
            width: 100%;
            max-width: 800px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .preview-area.active {
            display: block;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .status-text {
            color: #00ff00;
            font-size: 12px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            text-align: center;
            max-width: 600px;
        }

        .status-text.success {
            color: #00ff00;
        }

        .status-text.loading {
            color: #ffff00;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        @media (max-width: 600px) {
            .title {
                font-size: 2.5em;
                margin-bottom: 20px;
            }

            .search-wrapper {
                max-width: 100%;
            }

            .preview-area {
                height: 250px;
                max-width: 100%;
            }

            .buttons-group {
                gap: 8px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="starfield" id="starfield"></div>
    
    <div class="container">
        <div class="top-section">
            <div class="title">interesting</div>
            
            <div class="search-wrapper">
                <input 
                    type="url" 
                    class="search-box" 
                    id="urlInput" 
                    placeholder="Enter website URL..."
                    value="https://example.com"
                >
            </div>

            <div class="buttons-group">
                <button class="btn" onclick="loadProxy()">Load via Proxy</button>
                <button class="btn" onclick="clearProxy()">Clear</button>
            </div>
        </div>

        <div class="bottom-section">
            <div class="preview-area" id="previewArea">
                <iframe class="preview-frame" id="proxyFrame"></iframe>
            </div>
            <div class="status-text" id="statusText"></div>
        </div>
    </div>

    <script>
        // Generate starfield background
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            const starCount = 100;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.opacity = Math.random() * 0.5 + 0.3;
                star.style.width = (Math.random() * 2 + 0.5) + 'px';
                star.style.height = star.style.width;
                starfield.appendChild(star);
            }
        }

        createStarfield();

        const urlInput = document.getElementById('urlInput');
        const proxyFrame = document.getElementById('proxyFrame');
        const previewArea = document.getElementById('previewArea');
        const statusText = document.getElementById('statusText');

        const P2P_BACKEND = 'https://cdn.jsdelivr.net/gh/Onex558/p2p-svg-1@8f93a47855d5bdb174b2231de815fbb0f91cf1e2/yoursitename-fetch-310.svg';

        async function proxyURL(url) {
            try {
                const encodedURL = encodeURIComponent(url);
                const proxyURL = `${P2P_BACKEND}?url=${encodedURL}`;
                return proxyURL;
            } catch (error) {
                console.error('Error creating proxy URL:', error);
                return null;
            }
        }

        async function loadProxy() {
            const url = urlInput.value.trim();

            if (!url) {
                statusText.textContent = '❌ Please enter a URL';
                statusText.className = 'status-text';
                return;
            }

            try {
                new URL(url);
            } catch {
                statusText.textContent = '❌ Invalid URL format';
                statusText.className = 'status-text';
                return;
            }

            statusText.textContent = '⏳ Loading through p2p proxy...';
            statusText.className = 'status-text loading';

            try {
                const proxiedURL = await proxyURL(url);
                
                if (proxiedURL) {
                    previewArea.classList.add('active');
                    proxyFrame.src = proxiedURL;

                    setTimeout(() => {
                        statusText.textContent = `✓ Proxy Active | Backend: p2p-svg | Target: ${url}`;
                        statusText.className = 'status-text success';
                    }, 1500);
                } else {
                    statusText.textContent = '❌ Failed to create proxy connection';
                    statusText.className = 'status-text';
                }
            } catch (error) {
                statusText.textContent = `❌ Error: ${error.message}`;
                statusText.className = 'status-text';
            }
        }

        function clearProxy() {
            urlInput.value = 'https://example.com';
            proxyFrame.src = '';
            previewArea.classList.remove('active');
            statusText.textContent = '';
            statusText.className = 'status-text';
        }

        // Enter key to load
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadProxy();
        });

        // Initial status
        statusText.textContent = '✓ System Ready | Enter URL and click "Load via Proxy"';
        statusText.className = 'status-text success';
    </script>
</body>
</html>
