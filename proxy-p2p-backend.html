<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>interesting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .title {
            font-size: 4em;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 50px;
            color: white;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-box {
            width: 100%;
            padding: 16px 24px;
            border: 2px solid transparent;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.95);
            font-size: 16px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            font-family: inherit;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .search-box:focus {
            box-shadow: 0 0 0 0 rgba(42, 82, 152, 0.4),
                        0 8px 32px rgba(42, 82, 152, 0.3);
            border-color: #2a5298;
            animation: pulseOutline 1.5s ease-out infinite;
        }

        @keyframes pulseOutline {
            0% {
                box-shadow: 0 0 0 0 rgba(42, 82, 152, 0.7),
                            0 8px 32px rgba(42, 82, 152, 0.3);
            }
            100% {
                box-shadow: 0 0 0 15px rgba(42, 82, 152, 0),
                            0 8px 32px rgba(42, 82, 152, 0.3);
            }
        }

        .search-box::placeholder {
            color: #999;
        }

        .result-container {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, padding 0.5s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-container.active {
            max-height: 600px;
            padding: 30px;
        }

        .result-content {
            color: white;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
            max-height: 500px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .result-content::-webkit-scrollbar {
            width: 6px;
        }

        .result-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .result-content::-webkit-scrollbar-thumb {
            background: rgba(42, 82, 152, 0.5);
            border-radius: 10px;
        }

        .result-content::-webkit-scrollbar-thumb:hover {
            background: rgba(42, 82, 152, 0.8);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            color: #00ff00;
            font-size: 12px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .error-text {
            color: #ff4444;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 2.8em;
                margin-bottom: 40px;
            }

            .search-box {
                padding: 14px 20px;
                font-size: 15px;
            }

            .result-container.active {
                max-height: 400px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    
    <div class="container">
        <div class="title">interesting</div>
        
        <div class="search-wrapper">
            <input 
                type="text" 
                class="search-box" 
                id="urlInput" 
                placeholder="Search anything..."
            >
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-content" id="resultContent"></div>
        </div>

        <div class="status-text" id="statusText"></div>
    </div>

    <script>
        // ============ INTERACTIVE STARFIELD ============
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 1.5 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            update(mouseX, mouseY) {
                // Move stars
                this.x += this.vx;
                this.y += this.vy;

                // Wrap around edges
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                // Repel from cursor
                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const repelDistance = 150;

                if (distance < repelDistance) {
                    const force = (repelDistance - distance) / repelDistance;
                    this.vx += (dx / distance) * force * 1.5;
                    this.vy += (dy / distance) * force * 1.5;
                    
                    // Create shooting star effect
                    if (Math.random() > 0.95) {
                        createShootingStar(this.x, this.y, this.vx, this.vy);
                    }
                }

                // Dampen velocity
                this.vx *= 0.98;
                this.vy *= 0.98;
            }
        }

        class ShootingStar {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx * 3;
                this.vy = vy * 3;
                this.life = 1;
                this.trailLength = 50;
                this.trail = [];
            }

            draw() {
                ctx.strokeStyle = `rgba(255, 255, 200, ${this.life * 0.8})`;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                if (this.trail.length > 0) {
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                }
                ctx.stroke();

                ctx.fillStyle = `rgba(255, 255, 200, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                this.trail.unshift({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.pop();
                }

                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;

                this.vx *= 0.99;
                this.vy *= 0.99;
            }
        }

        const stars = [];
        const shootingStars = [];
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        function createShootingStar(x, y, vx, vy) {
            shootingStars.push(new ShootingStar(x, y, vx, vy));
        }

        function initStars() {
            for (let i = 0; i < 150; i++) {
                stars.push(new Star());
            }
        }

        function animateStars() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw stars
            stars.forEach(star => {
                star.update(mouseX, mouseY);
                star.draw();
            });

            // Update and draw shooting stars
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                shootingStars[i].update();
                shootingStars[i].draw();
                if (shootingStars[i].life <= 0) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(animateStars);
        }

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        document.addEventListener('touchmove', (e) => {
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        initStars();
        animateStars();

        // ============ PROXY BACKEND ============
        const urlInput = document.getElementById('urlInput');
        const resultContainer = document.getElementById('resultContainer');
        const resultContent = document.getElementById('resultContent');
        const statusText = document.getElementById('statusText');

        const P2P_BACKEND = 'https://cdn.jsdelivr.net/gh/Onex558/p2p-svg-1@8f93a47855d5bdb174b2231de815fbb0f91cf1e2/yoursitename-fetch-310.svg';

        async function fetchViaBackend(query) {
            resultContainer.classList.add('active');
            resultContent.innerHTML = '<div class="loading-spinner"></div> Loading...';
            statusText.textContent = '⏳ Fetching via p2p backend...';

            try {
                const encodedQuery = encodeURIComponent(query);
                const response = await fetch(`${P2P_BACKEND}?q=${encodedQuery}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.text();
                resultContent.innerHTML = data || 'No results found';
                statusText.textContent = '✓ Proxy Active | Backend: p2p-svg';
            } catch (error) {
                resultContent.innerHTML = `<div class="error-text">⚠ Error: ${error.message}</div><p>Make sure your query is valid and the backend is accessible.</p>`;
                statusText.textContent = '✗ Error connecting to backend';
            }
        }

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = urlInput.value.trim();
                if (query) {
                    fetchViaBackend(query);
                }
            }
        });

        statusText.textContent = '✓ System Ready | Enter search query';
    </script>
</body>
</html>
